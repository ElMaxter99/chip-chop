name: Release

# Creates a GitHub Release (tag vX.Y.Z) with installable bundles for Linux, Windows and macOS (macOS untested on a real Mac) when `main`
# has a package version without a release. Also runnable by hand from the Actions tab.
# Publishing to npm is separate and manual (see docs/RELEASING.md).
on:
  push:
    branches: [main]
    paths:
      - packages/core/package.json
      - .github/workflows/release.yml
      - scripts/**
      - desktop/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      needed: ${{ steps.ver.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Decide whether this version needs a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.ver.outputs.needed == 'true'
        run: |
          npm install
          npm run validate:schemas
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace chip-chop
          bash scripts/make-bundle.sh
      - name: Smoke-test the Linux bundle
        if: steps.ver.outputs.needed == 'true'
        run: |
          export HOME="$(mktemp -d)"
          tar xzf chip-chop-*-linux.tar.gz
          CHIPCHOP_SKIP_BROWSER=1 ./chip-chop-*-linux/install.sh
          "$HOME/.local/bin/chip-chop" --version
          "$HOME/.local/bin/chip-chop" help | head -3
      - if: steps.ver.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            chip-chop-*-linux.tar.gz
            chip-chop-*-macos.tar.gz
            chip-chop-*-windows.zip
            chip-chop-*.tgz

  smoke-windows:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          Expand-Archive chip-chop-*-windows.zip -DestinationPath .
          $env:CHIPCHOP_SKIP_BROWSER = "1"; $env:CHIPCHOP_SKIP_PATH = "1"
          $env:CHIPCHOP_PREFIX = Join-Path $env:RUNNER_TEMP "cc"
          $dir = (Get-ChildItem -Directory chip-chop-*-windows | Select-Object -First 1).FullName
          & (Join-Path $dir "install.ps1")
          & "$env:CHIPCHOP_PREFIX\bin\chip-chop.cmd" --version
          & "$env:CHIPCHOP_PREFIX\bin\chip-chop.cmd" help

  # Instalables nativos de la app de escritorio (Windows .exe, macOS .dmg, Linux AppImage/.deb/.rpm), uno por sistema.
  # Los de macOS son informativos: no se han probado en un Mac real y su fallo no bloquea la release.
  installers:
    needs: build
    if: needs.build.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
          - os: macos-latest
            name: macos-arm64
            experimental: true
          - os: macos-15-intel
            name: macos-x64
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node desktop/prepare-core.mjs
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - name: Herramientas de Linux (rpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Instaladores
        run: npx electron-builder --projectDir desktop --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Reunir los archivos que se publican
        shell: bash
        run: |
          mkdir -p stage
          cd release
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.rpm *.blockmap *.yml; do
            [ -e "$f" ] && case "$f" in builder-*) ;; *) cp "$f" ../stage/ ;; esac
          done
          ls -la ../stage
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: stage/*
          if-no-files-found: error

  # macOS: informativo. Nadie ha probado chip-chop en un Mac real; este job solo comprueba que el paquete se instala
  # y arranca en el runner. Si falla, no bloquea la publicación (se avisa en las notas de la release).
  smoke-macos:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          export HOME="$(mktemp -d)"
          tar xzf chip-chop-*-macos.tar.gz
          CHIPCHOP_SKIP_BROWSER=1 ./chip-chop-*-macos/install.sh
          "$HOME/.local/bin/chip-chop" --version
          "$HOME/.local/bin/chip-chop" help | head -3

  publish:
    needs: [build, smoke-windows, smoke-macos, installers]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.smoke-windows.result == 'success' && needs.installers.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
      - name: Unir los feeds de macOS (arm64 + Intel) y reunir los instaladores
        run: |
          mkdir -p assets
          for d in installers/*; do
            case "$d" in *macos-*) ;; *) cp "$d"/* assets/ ;; esac
          done
          A=$(ls installers/installers-macos-arm64/*-mac.yml 2>/dev/null | head -1 || true)
          B=$(ls installers/installers-macos-x64/*-mac.yml 2>/dev/null | head -1 || true)
          for d in installers/installers-macos-*; do
            [ -d "$d" ] && for f in "$d"/*; do case "$f" in *-mac.yml) ;; *) cp "$f" assets/ ;; esac; done
          done
          if [ -n "$A" ] && [ -n "$B" ]; then node scripts/merge-mac-feed.mjs "$A" "$B" --out "assets/$(basename "$A")"
          elif [ -n "$A$B" ]; then cp "$A$B" assets/; fi
          ls -la assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac   # v0.2.0-rc.1 is a release candidate
          # Notas: la sección del CHANGELOG; si no existe, las que genera GitHub.
          if node scripts/release-notes.mjs "${TAG#v}" --out notes.md; then NOTES="--notes-file notes.md"; else NOTES="--generate-notes"; fi
          if [ "${{ needs.smoke-macos.result }}" != "success" ]; then
            printf '\n> El paquete de macOS no pasó la comprobación automática (o no se ha validado nunca en un Mac real).\n' >> notes.md 2>/dev/null || true
          fi
          # Borrador primero, con todos los archivos; se publica al final (publicar es lo que activa el aviso de actualización).
          gh release create "$TAG" chip-chop-*-linux.tar.gz chip-chop-*-macos.tar.gz chip-chop-*-windows.zip chip-chop-*.tgz assets/* --draft --target "$GITHUB_SHA" --title "chip-chop $TAG" $NOTES $PRE
          gh release edit "$TAG" --draft=false --tag "$TAG"
          test "$(gh release view "$TAG" --json tagName,isDraft --jq '.tagName + " " + (.isDraft|tostring)')" = "$TAG false"
