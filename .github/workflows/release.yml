name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write   # npm trusted publishing (OIDC) + provenance, no long-lived token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm run validate:schemas
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish packages
        run: npm publish --workspaces --provenance --access public --if-present
