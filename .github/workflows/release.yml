name: Release

# Creates a GitHub Release (tag vX.Y.Z) with installable bundles for Linux, Windows and macOS (macOS untested on a real Mac) when `main`
# has a package version without a release. Also runnable by hand from the Actions tab.
# Publishing to npm is separate and manual (see docs/RELEASING.md).
on:
  push:
    branches: [main]
    paths:
      - packages/core/package.json
      - .github/workflows/release.yml
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      needed: ${{ steps.ver.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        name: Decide whether this version needs a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then echo "needed=false" >> "$GITHUB_OUTPUT"; else echo "needed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.ver.outputs.needed == 'true'
        run: |
          npm install
          npm run validate:schemas
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace chip-chop
          bash scripts/make-bundle.sh
      - name: Smoke-test the Linux bundle
        if: steps.ver.outputs.needed == 'true'
        run: |
          export HOME="$(mktemp -d)"
          tar xzf chip-chop-*-linux.tar.gz
          CHIPCHOP_SKIP_BROWSER=1 ./chip-chop-*-linux/install.sh
          "$HOME/.local/bin/chip-chop" --version
          "$HOME/.local/bin/chip-chop" help | head -3
      - if: steps.ver.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: |
            chip-chop-*-linux.tar.gz
            chip-chop-*-macos.tar.gz
            chip-chop-*-windows.zip
            chip-chop-*.tgz

  smoke-windows:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - shell: pwsh
        run: |
          Expand-Archive chip-chop-*-windows.zip -DestinationPath .
          $env:CHIPCHOP_SKIP_BROWSER = "1"; $env:CHIPCHOP_SKIP_PATH = "1"
          $env:CHIPCHOP_PREFIX = Join-Path $env:RUNNER_TEMP "cc"
          $dir = (Get-ChildItem -Directory chip-chop-*-windows | Select-Object -First 1).FullName
          & (Join-Path $dir "install.ps1")
          & "$env:CHIPCHOP_PREFIX\bin\chip-chop.cmd" --version
          & "$env:CHIPCHOP_PREFIX\bin\chip-chop.cmd" help

  # macOS: informativo. Nadie ha probado chip-chop en un Mac real; este job solo comprueba que el paquete se instala
  # y arranca en el runner. Si falla, no bloquea la publicación (se avisa en las notas de la release).
  smoke-macos:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          export HOME="$(mktemp -d)"
          tar xzf chip-chop-*-macos.tar.gz
          CHIPCHOP_SKIP_BROWSER=1 ./chip-chop-*-macos/install.sh
          "$HOME/.local/bin/chip-chop" --version
          "$HOME/.local/bin/chip-chop" help | head -3

  publish:
    needs: [build, smoke-windows, smoke-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.smoke-windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          PRE=""
          case "$TAG" in *-*) PRE="--prerelease";; esac   # v0.2.0-rc.1 is a release candidate
          # Notas: la sección del CHANGELOG; si no existe, las que genera GitHub.
          if node scripts/release-notes.mjs "${TAG#v}" --out notes.md; then NOTES="--notes-file notes.md"; else NOTES="--generate-notes"; fi
          if [ "${{ needs.smoke-macos.result }}" != "success" ]; then
            printf '\n> El paquete de macOS no pasó la comprobación automática (o no se ha validado nunca en un Mac real).\n' >> notes.md 2>/dev/null || true
          fi
          # Borrador primero, con todos los archivos; se publica al final (publicar es lo que activa el aviso de actualización).
          gh release create "$TAG" chip-chop-*-linux.tar.gz chip-chop-*-macos.tar.gz chip-chop-*-windows.zip chip-chop-*.tgz --draft --target "$GITHUB_SHA" --title "chip-chop $TAG" $NOTES $PRE
          gh release edit "$TAG" --draft=false --tag "$TAG"
          test "$(gh release view "$TAG" --json tagName,isDraft --jq '.tagName + " " + (.isDraft|tostring)')" = "$TAG false"
