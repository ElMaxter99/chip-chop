name: Release

# Creates a GitHub Release (tag vX.Y.Z + installable tarball) when `main` contains a
# package version that has no release yet. Also runnable by hand from the Actions tab.
# Publishing to npm is separate and manual (see docs/RELEASING.md).
on:
  push:
    branches: [main]
    paths:
      - packages/core/package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version needs a release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$V" >> "$GITHUB_OUTPUT"
          if gh release view "$V" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.ver.outputs.exists == 'false'
        run: |
          npm install
          npm run validate:schemas
          npm run typecheck
          npm test
          npx playwright install --with-deps chromium
          npm run test:e2e --workspace chip-chop
          npm pack --workspace chip-chop
      - name: Create GitHub Release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.ver.outputs.tag }}" chip-chop-*.tgz --target "$GITHUB_SHA" --title "chip-chop ${{ steps.ver.outputs.tag }}" --generate-notes
