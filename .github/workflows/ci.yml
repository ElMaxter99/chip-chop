name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate JSON Schemas and their examples
        run: npm run validate:schemas
      - name: Type-check all packages
        run: npm run typecheck
      - name: Unit tests
        run: npm test

  # Once the engine exists, this job runs chip-chop against the demo apps
  # (AngularJS first, then Angular and React) and uploads the reports as artifacts.
  examples:
    if: ${{ false }}   # enable when packages/core can capture and compare
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:examples --workspaces --if-present
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chip-chop-example-reports
          path: examples/**/.chipchop/reports/
