name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate JSON Schemas and their examples
        run: npm run validate:schemas
      - name: Type-check all packages
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Script tests (changelog)
        run: npm run test:scripts

  # Real browser, real pngjs/pixelmatch: builds a temp git repo from examples/static-demo
  # and runs restyle and flow-audit comparisons end to end.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --workspace chip-chop

  # El flujo de release exige una entrada en changelog/unreleased/ cuando una PR cambia la app.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run changelog:check -- --base origin/${{ github.base_ref }}

  # macOS: informativo (continue-on-error). No hay Mac real detrás; esto solo cazaría roturas obvias.
  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:e2e --workspace chip-chop
