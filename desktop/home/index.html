<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chip Chop · Inicio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{visibility:hidden}
.hero{display:flex;align-items:center;gap:16px}
.hero img{width:56px;height:56px}
.proj{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0}
.proj .nm{font-weight:800;font-size:16px}
.proj .pt{font:12px "JetBrains Mono",ui-monospace,Consolas,monospace;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:24px;border:2px dashed var(--ink);border-radius:8px;text-align:center}
.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;height:36px}
.spin{display:inline-block;width:14px;height:14px;border:3px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <strong class="brand">chip-chop</strong>
  <nav id="tabs"><button data-tab="proyectos" class="on">Proyectos</button><button data-tab="ia">IA</button><button data-tab="ajustes">Ajustes</button></nav>
  <button id="ver" class="ver" data-tab="ajustes">v…</button>
</div></header>
<main>
  <section id="browser"></section>
  <section id="proyectos" class="tab"></section>
  <section id="ia" class="tab" hidden></section>
  <section id="ajustes" class="tab" hidden></section>
</main>
<script src="home.js"></script>
</body>
</html>
