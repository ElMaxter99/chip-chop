<h2>Passwords</h2>
<p ng-if="vm.loading">Loading…</p>
<p class="empty" ng-if="!vm.loading && !vm.items.length">No passwords yet.</p>
<table ng-if="!vm.loading && vm.items.length">
  <thead><tr><th>Title</th><th>User</th><th>Status</th><th></th></tr></thead>
  <tbody>
    <tr ng-repeat="p in vm.items track by p.id">
      <td>{{ p.title }}</td>
      <td>{{ p.username }}</td>
      <td>{{ p.isActive ? 'Active' : 'Inactive' }}</td>
      <td>
        <button type="button" ng-click="vm.askShare(p)">Share</button>
        <button type="button" ng-click="vm.askDelete(p)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div class="backdrop" ng-if="vm.toDelete">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Delete password">
    <h2>Delete password</h2>
    <p>Delete <b>{{ vm.toDelete.title }}</b>? This cannot be undone.</p>
    <div class="actions">
      <button type="button" ng-click="vm.cancel()">Cancel</button>
      <button type="button" class="danger" ng-click="vm.confirmDelete()">Confirm</button>
    </div>
  </div>
</div>

<div class="backdrop" ng-if="vm.toShare">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Share password">
    <h2>Share password</h2>
    <p>Share <b>{{ vm.toShare.title }}</b> with:</p>
    <select aria-label="Recipient" ng-model="vm.recipient" ng-options="o for o in vm.options"></select>
    <div class="actions">
      <button type="button" ng-click="vm.closeShare()">Cancel</button>
      <button type="button" ng-click="vm.send()">Send</button>
    </div>
  </div>
</div>

<div class="toast" role="status" ng-if="vm.shared">Password shared</div>
