app: Vault AngularJS demo
framework: angularjs

build:
  install: npm install --no-audit --no-fund
  command: node build.mjs

serve:
  command: node server.mjs {port} .
  url: http://localhost:{port}
  readyPath: /

viewports:
  - { name: desktop, width: 1000, height: 700 }
  - { name: mobile, width: 390, height: 700 }

auth:
  mode: none

externalAssets:
  mode: placeholder
  sizes:
    - { match: "**/banner.png", width: 1500, height: 80 }

compare:
  pixelThreshold: 0.1
  maxDiffPixelRatio: 0
