id: passwords-share
title: Share a password
mocks: [passwords/list-with-data, share/options, share/send]
steps:
  - goto: /#!/passwords
  - click: { role: button, name: "Share" }
  - capture: passwords-share-modal
  - select: { target: { role: combobox, name: "Recipient" }, option: "Luis" }
  - click: { role: button, name: "Send" }
  - wait:
      visible: { role: status }
  - capture: passwords-share-sent
