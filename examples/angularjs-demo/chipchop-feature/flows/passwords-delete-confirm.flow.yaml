id: passwords-delete-confirm
title: Confirm the deletion of a password
mocks: [passwords/list-with-data, passwords/delete]
steps:
  - goto: /#!/passwords
  - click: { role: button, name: "Delete" }
  - click: { role: button, name: "Confirm" }
  - wait:
      hidden: { role: dialog }
  - capture: passwords-deleted
