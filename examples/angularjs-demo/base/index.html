<!doctype html>
<html lang="en" ng-app="vault">
<head>
  <meta charset="utf-8">
  <title>Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Vault</h1>
    <nav ng-controller="NavCtrl as nav">
      <a href="#!/home" ng-class="{active: nav.is('/home')}">Home</a>
      <a href="#!/passwords" ng-class="{active: nav.is('/passwords')}">Passwords</a>
    </nav>
    <span class="clock" ng-controller="ClockCtrl as clock" ng-cloak>{{ clock.now | date:'mediumTime' }}</span>
  </header>
  <img class="banner" src="https://cdn.example.com/banner.png" width="1000" height="54" alt="Promo banner">
  <main ng-view></main>
  <script src="vendor/angular.min.js"></script>
  <script src="vendor/angular-route.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
