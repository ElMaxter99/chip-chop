# .chipchop/flows/passwords-delete.flow.yaml
id: passwords-delete
title: Delete a password
description: From the list, open the delete confirmation and confirm.
mocks:
  - auth/login-ok
  - passwords/list-with-data

steps:
  - goto: /#!/passwords
  - capture: passwords

  - click: { role: button, name: "Delete" }
    note: First row's delete button.
  - capture: passwords-delete-modal

  - press: Escape
  - wait:
      hidden: { role: dialog }
